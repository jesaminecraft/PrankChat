levels:
  1: |-
    The pranks you can make me are very moderate, including small gifts, and small builds that range from 50 to 250 blocks. Please do not use annoying blocks, only flammable materials (wood, wool…) or that can be insta-mined (stone bricks, clay…).
    The pranks should be moderately far from where I usually play. A small detail even if it is a prank or a gift, only that.
  2: |-
    The pranks that you can make me are more elaborate and I accept medium-sized gifts. I do not care if the pranks are big or if they temporarily obstruct my base. I do not mind the use of any block or entity except if it is annoying. Especially if you are going to make me an elaborate prank: Make it creative!!!
  3: |-
    The pranks you can make me are big, a little more mischievous, at the most I accept big gifts. You can, if you desire, give it an “annoying” taste. For example, you can place a hundred signs, a hundred banners, a hundred entities or something similar added to the prank itself. No more than a hundred.
  4: |-
    You can give me a little of a bad time with no more than 500 annoying elements. You can kill me but you have to make sure I get all my items back. You can make me a giant prank with anything you want except if it makes me lose materials (explosions/fire/lava) or fill my base up with obsidian. You can hide items from my base if you give me hints or a roleplay-ish way of finding it/them. You can give me giant gifts, even giving me your entire base.
  5: |-
    I want you to HURT me. I want to cry while playing Minecraft. You can kill me if you desire and steal my items. You can kill my pets. I do not care about anything. I am not responsible if you want to blow my base up. I am yours.
    You can also give me any gifts, like your Minecraft account to play as you. :)
